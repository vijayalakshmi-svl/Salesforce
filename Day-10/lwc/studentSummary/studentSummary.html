<template>

    <lightning-card
        title="Student Summary"
        icon-name="standard:contact"
    >

        <div class="slds-p-around_medium">

            <!-- =========================
                 LOADING
                 ========================= -->

            <template if:true={isLoading}>

                <lightning-spinner
                    alternative-text="Loading student summary"
                    size="medium">
                </lightning-spinner>

            </template>


            <!-- =========================
                 ERROR
                 ========================= -->

            <template if:true={errorMessage}>

                <div
                    class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium"
                    role="alert"
                >

                    <span>{errorMessage}</span>

                </div>

            </template>


            <!-- =========================
                 STUDENT SUMMARY
                 ========================= -->

            <template if:true={student}>

                <div class="slds-grid slds-wrap slds-gutters">

                    <!-- STUDENT NAME -->

                    <div
                        class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3"
                    >

                        <div class="slds-box slds-theme_default">

                            <p class="slds-text-title">
                                Student Name
                            </p>

                            <p class="slds-text-heading_medium slds-m-top_x-small">
                                {student.Name}
                            </p>

                        </div>

                    </div>


                    <!-- CGPA -->

                    <div
                        class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3"
                    >

                        <div class="slds-box slds-theme_default">

                            <p class="slds-text-title">
                                CGPA
                            </p>

                            <p class="slds-text-heading_medium slds-m-top_x-small">
                                {student.CGPA__c}
                            </p>

                        </div>

                    </div>


                    <!-- APPLICATION COUNT -->

                    <div
                        class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3"
                    >

                        <div class="slds-box slds-theme_default">

                            <p class="slds-text-title">
                                Applications
                            </p>

                            <p class="slds-text-heading_medium slds-m-top_x-small">
                                {applicationCount}
                            </p>

                        </div>

                    </div>

                </div>


                <!-- APPLICATION STATUS -->

                <template if:true={hasApplications}>

                    <div class="slds-m-top_medium">

                        <div class="slds-text-color_success">

                            You have submitted
                            {applicationCount}
                            application(s).

                        </div>

                    </div>

                </template>


                <template if:false={hasApplications}>

                    <div class="slds-m-top_medium">

                        <div class="slds-text-color_weak">

                            You have not submitted any applications yet.

                        </div>

                    </div>

                </template>

            </template>

        </div>

    </lightning-card>

</template>
