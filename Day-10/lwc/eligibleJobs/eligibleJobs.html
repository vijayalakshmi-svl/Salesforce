<template>

    <lightning-card
        title="Eligible Jobs"
        icon-name="standard:job_position"
    >

        <div class="slds-p-around_medium">

            <!-- =========================
                 LOADING
                 ========================= -->

            <template if:true={isLoading}>

                <lightning-spinner
                    alternative-text="Loading jobs"
                    size="medium">
                </lightning-spinner>

            </template>


            <!-- =========================
                 SUCCESS MESSAGE
                 ========================= -->

            <template if:true={successMessage}>

                <div
                    class="slds-notify slds-notify_alert slds-theme_success slds-m-bottom_medium"
                    role="alert"
                >

                    <span>{successMessage}</span>

                </div>

            </template>


            <!-- =========================
                 ERROR MESSAGE
                 ========================= -->

            <template if:true={errorMessage}>

                <div
                    class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium"
                    role="alert"
                >

                    <span>{errorMessage}</span>

                </div>

            </template>


            <!-- =========================
                 REUSABLE JOB CARDS
                 ========================= -->

            <template if:true={jobs.length}>

                <div class="slds-grid slds-wrap slds-gutters">

                    <template
                        for:each={jobs}
                        for:item="job"
                    >

                        <div
                            key={job.Id}
                            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_medium"
                        >

                            <c-job-card
                                job={job}
                                onapply={handleApply}
                            >
                            </c-job-card>

                        </div>

                    </template>

                </div>

            </template>


            <!-- =========================
                 EMPTY STATE
                 ========================= -->

            <template if:false={jobs.length}>

                <template if:false={isLoading}>

                    <div
                        class="slds-align_absolute-center slds-p-around_xx-large"
                    >

                        <div class="slds-text-align_center">

                            <lightning-icon
                                icon-name="utility:info"
                                size="medium"
                                class="slds-m-bottom_small">
                            </lightning-icon>

                            <h3 class="slds-text-heading_medium">
                                No Eligible Jobs
                            </h3>

                            <p class="slds-text-color_weak slds-m-top_small">
                                There are currently no jobs matching
                                your eligibility criteria.
                            </p>

                        </div>

                    </div>

                </template>

            </template>

        </div>

    </lightning-card>

</template>
