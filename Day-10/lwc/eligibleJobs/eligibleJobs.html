<template>

    <lightning-card
        title="Eligible Jobs"
        icon-name="standard:job_position"
    >

        <div class="slds-p-around_medium">

            <template if:true={isLoading}>

                <lightning-spinner
                    alternative-text="Loading jobs"
                    size="medium">
                </lightning-spinner>

            </template>

            <template if:true={successMessage}>

                <div
                    class="slds-notify slds-notify_alert slds-theme_success slds-m-bottom_medium"
                    role="alert"
                >
                    <span>{successMessage}</span>
                </div>

            </template>

            <template if:true={errorMessage}>

                <div
                    class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium"
                    role="alert"
                >
                    <span>{errorMessage}</span>
                </div>

            </template>

            <template if:true={jobs.length}>

                <div class="slds-grid slds-wrap slds-gutters">

                    <template
                        for:each={jobs}
                        for:item="job"
                    >

                        <div
                            key={job.Id}
                            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_medium"
                        >

                            <article class="slds-card slds-card_boundary">

                                <div class="slds-card__header slds-grid">

                                    <header
                                        class="slds-media slds-media_center slds-has-flexi-truncate"
                                    >

                                        <div class="slds-media__figure">

                                            <lightning-icon
                                                icon-name="standard:job_position"
                                                size="small">
                                            </lightning-icon>

                                        </div>

                                        <div class="slds-media__body">

                                            <h2 class="slds-card__header-title">

                                                <span class="slds-truncate">
                                                    {job.Name}
                                                </span>

                                            </h2>

                                        </div>

                                    </header>

                                </div>

                                <div class="slds-card__body slds-card__body_inner">

                                    <p class="slds-m-bottom_small">
                                        <strong>Company:</strong>
                                        {job.Company__c}
                                    </p>

                                    <p class="slds-m-bottom_small">
                                        <strong>Minimum CGPA:</strong>
                                        {job.Minimum_CGPA__c}
                                    </p>

                                    <p class="slds-m-bottom_small">
                                        <strong>Closing Date:</strong>
                                        {job.Closing_Date__c}
                                    </p>

                                </div>

                                <footer class="slds-card__footer">

                                    <lightning-button
                                        variant="brand"
                                        label="Apply Now"
                                        data-job-id={job.Id}
                                        onclick={handleApply}
                                    >
                                    </lightning-button>

                                </footer>

                            </article>

                        </div>

                    </template>

                </div>

            </template>

            <template if:false={jobs.length}>

                <template if:false={isLoading}>

                    <div
                        class="slds-align_absolute-center slds-p-around_xx-large"
                    >

                        <div class="slds-text-align_center">

                            <lightning-icon
                                icon-name="utility:info"
                                size="medium"
                                class="slds-m-bottom_small">
                            </lightning-icon>

                            <h3 class="slds-text-heading_medium">
                                No Eligible Jobs
                            </h3>

                            <p class="slds-text-color_weak slds-m-top_small">
                                There are currently no jobs matching
                                your eligibility criteria.
                            </p>

                        </div>

                    </div>

                </template>

            </template>

        </div>

    </lightning-card>

</template>
